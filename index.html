<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>The Dev News</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <h1>The Dev News</h1>
    </header>

    <div class="container-geral">

        <main class="layout-principal">
            <article class="card">
                <img src="./assets/cidade.svg" alt="Notícia Principal" class="card-img">
                <div class="card-content">
                </div>
            </article>

            <section class="sidebar">
                <div class="titulo-popular">
                    <h2>Posts populares</h2>
                </div>
                <div class="lista-posts">
                    <article class="item-post"><img src="./assets/desenvolvimento.svg" class="mini-imagem"></article>
                    <article class="item-post"><img src="./assets/gitlab.svg" class="mini-imagem"></article>
                    <article class="item-post item-selecionado"><img src="./assets/cafe.svg" class="mini-imagem"></article>
                </div>
            </section>
        </main>

        <section class="recentes-container">
        <div class="header-recentes">
            <h2>Posts mais recentes</h2>
            <a href="#">Ver todos</a>
        </div>

        <div class="conteudo-inferior">
            
            <div class="grid-posts">
                <article class="card-recente">
                    <img src="./assets/card.svg" alt="Post 1" class="img-recente">
                </article>
            </div>

            <aside class="sidebar-categorias">
                <div class="titulo-sidebar">
                    <h2>Categorias</h2>
                </div>
                <ul class="lista-categorias">
                    <li>
                        <a href="#" class="nome-cat">> saude</a>
                        <small class="quantidade">(1)</small>
                    </li>
                    <li>
                        <a href="#" class="nome-cat">> desenvolvimento</a>
                        <small class="quantidade">(2)</small>
                    </li>
                    <li>
                        <a href="#" class="nome-cat">> produtividade</a>
                        <small class="quantidade">(2)</small>
                    </li>
                    <li>
                        <a href="#" class="nome-cat">> opiniao</a>
                        <small class="quantidade">(1)</small>
                    </li>
                </ul>
            </aside>
        </div> 
    </section>
</div>
    <div>
    <footer class="site-footer">
    <p>Copyright@The Dev News</p>
    </footer>
    </div>
    
 </body>
</html>
